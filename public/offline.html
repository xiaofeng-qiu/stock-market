<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b5cd9">
  <title>离线 · 预判验证</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f6fa; color: #1f2430; padding: 24px; }
    .card { max-width: 380px; width: 100%; background: #fff; border-radius: 16px; padding: 32px 24px;
      text-align: center; box-shadow: 0 8px 30px rgba(31,36,48,.08); }
    .icon { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 18px; background: #2b5cd9;
      color: #fff; display: flex; align-items: center; justify-content: center; font-size: 28px; }
    h1 { font-size: 19px; margin: 0 0 10px; }
    p { font-size: 14px; line-height: 1.7; color: #6b7280; margin: 0 0 20px; }
    button { border: 0; background: #2b5cd9; color: #fff; font-size: 15px; padding: 11px 28px;
      border-radius: 10px; cursor: pointer; }
    .note { margin-top: 18px; font-size: 12px; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">◎</div>
    <h1>当前离线</h1>
    <p>这个页面还没有缓存。已读过的新闻和本地记录的预判仍可查看，行情与验证需要联网。</p>
    <button onclick="location.href='/'">回到 App</button>
    <div class="note">行情与验证结果不使用缓存，以保证判定结果真实可信</div>
  </div>
</body>
</html>
